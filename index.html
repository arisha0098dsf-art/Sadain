<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium Button</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #090014, #18002b, #050505);
        font-family: Arial, sans-serif;
    }

    .premium-btn {
        position: relative;
        padding: 16px 42px;
        color: white;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 1px;
        text-decoration: none;

        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 14px;

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        overflow: hidden;
        cursor: pointer;

        transition: 
            transform 0.35s ease,
            box-shadow 0.35s ease,
            border-color 0.35s ease;
    }

    /* Shine animation */
    .premium-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 70%;
        height: 100%;

        background: linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.5),
            transparent
        );

        transform: skewX(-25deg);
        transition: left 0.7s ease;
    }

    /* Gradient glow */
    .premium-btn::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;

        background: linear-gradient(
            135deg,
            rgba(255, 0, 128, 0.15),
            rgba(120, 0, 255, 0.2),
            rgba(0, 200, 255, 0.15)
        );

        opacity: 0;
        transition: opacity 0.4s ease;
    }

    .premium-btn span {
        position: relative;
        z-index: 2;
    }

    /* HOVER */
    .premium-btn:hover {
        transform: translateY(-6px) scale(1.04);

        border-color: rgba(255,255,255,0.7);

        box-shadow:
            0 10px 30px rgba(140, 0, 255, 0.35),
            0 0 25px rgba(255, 0, 150, 0.25),
            inset 0 0 20px rgba(255,255,255,0.08);
    }

    .premium-btn:hover::before {
        left: 150%;
    }

    .premium-btn:hover::after {
        opacity: 1;
    }

    /* CLICK */
    .premium-btn:active {
        transform: translateY(-2px) scale(0.98);
    }
</style>
</head>

<body>

<a href="https://umairbaloch.netlify.app/" class="premium-btn">
    <span>Umair Baloch ✦</span>
</a>

</body>
</html>
